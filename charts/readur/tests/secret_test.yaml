# helm-unittest suite for templates/secret.yaml.
suite: auth secret
templates:
  - templates/secret.yaml
release:
  name: readur
tests:
  - it: generates an admin password and keeps the Secret on uninstall
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: readur-auth
      - exists:
          path: data.ADMIN_PASSWORD
      - notExists:
          path: data.JWT_SECRET
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: stores explicit credentials
    set:
      auth.adminPassword: hunter2hunter2
      auth.jwtSecret: 0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: data.ADMIN_PASSWORD
          value: aHVudGVyMmh1bnRlcjI=
      - equal:
          path: data.JWT_SECRET
          value: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  - it: renders nothing with auth.existingSecret
    set:
      auth.existingSecret: my-auth
    asserts:
      - hasDocuments:
          count: 0
