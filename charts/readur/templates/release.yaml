{{- /*
Settings the chart applies on top of the bjw-s common library defaults that
are not exposed in values.yaml. They are defaults, not overrides: any value a
user sets (including false, "" and empty lists) wins, see the merge below.
*/ -}}
{{- define "readur.baseValues" -}}
controllers:
  main:
    initContainers:
      fixperms:
        image:
          repository: busybox
          tag: "1.37.0"
        command:
          - sh
          - -c
          - |
            echo "Fixing permissions for Readur directories, this may take some time..."
            for dir in /app/uploads /app/watch; do
              # A volume may be disabled (e.g. no watch folder): skip it.
              if [ ! -d "$dir" ]; then
                echo "$dir is not mounted, skipping"
                continue
              fi
              chown -R 1000:1000 "$dir"
              # uploads/.readur holds owner-only files (e.g. a generated admin
              # password); keep their modes.
              find "$dir" -path /app/uploads/.readur -prune -o -exec chmod 755 {} +
            done
            echo "Permissions fixed successfully"
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - CHOWN
              - FOWNER
    containers:
      readur:
        env:
          # Optional: without it Readur keeps a generated key in its database.
          JWT_SECRET:
            valueFrom:
              secretKeyRef:
                name: {{ include "readur.authSecretName" . }}
                key: JWT_SECRET
                optional: true
          # Only used when the admin account is first created.
          ADMIN_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: {{ include "readur.authSecretName" . }}
                key: ADMIN_PASSWORD
                optional: true

        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

        probes:
          startup:
            enabled: true
            custom: true
            type: HTTP
            spec:
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
              httpGet: &probesPath
                path: /api/health
                port: 8000
          readiness: &probes
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 10
              httpGet: *probesPath
          liveness: *probes

{{ end }}

{{- /*
User values win over the base values. `mergeOverwrite` lets explicit false,
"" and [] from values.yaml or --set replace a base default; sprig's `merge`
treats those as unset, which made e.g. `persistence.watch.enabled=false`
impossible to apply.
*/ -}}
{{- $ctx := deepCopy . -}}
{{- $values := mergeOverwrite (include "readur.baseValues" . | fromYaml) (deepCopy .Values) -}}
{{- /* An empty image tag means the Readur release this chart ships (appVersion). */ -}}
{{- $image := dig "controllers" "main" "containers" "readur" "image" dict $values -}}
{{- if and (kindIs "map" $image) (not $image.tag) -}}
  {{- $_ := set $image "tag" (toString .Chart.AppVersion) -}}
{{- end -}}
{{- $_ := set $ctx "Values" $values -}}
{{- include "bjw-s.common.loader.all" $ctx }}
