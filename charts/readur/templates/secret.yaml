{{- /*
`lookup` returns nothing when rendering without cluster access (helm
template, Argo CD), so generated values would
change on every render there. Those setups must use auth.existingSecret or
explicit auth.jwtSecret / auth.adminPassword; see values.yaml.
*/}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "readur.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := dig "data" (dict) ($existing | default dict) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Keep the generated values if the release is uninstalled, so existing
    # sessions and the admin password survive a reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.auth.jwtSecret }}
  JWT_SECRET: {{ .Values.auth.jwtSecret | b64enc | quote }}
  {{- else if hasKey $existingData "JWT_SECRET" }}
  JWT_SECRET: {{ index $existingData "JWT_SECRET" | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.adminPassword }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | b64enc | quote }}
  {{- else if hasKey $existingData "ADMIN_PASSWORD" }}
  ADMIN_PASSWORD: {{ index $existingData "ADMIN_PASSWORD" | quote }}
  {{- else }}
  ADMIN_PASSWORD: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
