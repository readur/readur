## This chart relies on the common library chart from bjw-s
## You can find it and the values you can provide and modify, at https://github.com/bjw-s/helm-charts/blob/common-3.3.2/charts/library/common/values.yaml
## Refer there for more detail about the supported values.
## Any values that you find in the above `values.yaml` can be provided to this chart and are then rendered.

## Credentials. By default the chart creates a Secret named `<release>-auth`
## with a random initial ADMIN_PASSWORD, generated once and preserved across
## upgrades. Read it with:
##   kubectl get secret <release>-auth -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d
##
## JWT_SECRET is optional. Without it Readur generates a signing key on first
## start and keeps it in its database; `readur rotate-jwt-secret` replaces it.
## Set `auth.jwtSecret` (or JWT_SECRET in `auth.existingSecret`) to manage the
## key yourself.
##
## GitOps / `helm template`: preserving the generated admin password relies on
## Helm's `lookup` function, which only works when Helm talks to the cluster
## (`helm install` / `helm upgrade`). Renderers that do not, such as
## `helm template` and Argo CD, cannot see the existing Secret and generate a
## new value on every render. With those tools, set `auth.existingSecret` to a
## Secret you manage (e.g. Sealed Secrets or External Secrets), or set
## `auth.adminPassword`.
auth:
  # Use an existing Secret instead. It may contain ADMIN_PASSWORD and
  # JWT_SECRET (at least 32 bytes).
  existingSecret: ""
  # Optional JWT signing secret (at least 32 bytes); leave empty to let
  # Readur keep a generated key in its database.
  jwtSecret: ""
  # Initial admin password; leave empty to generate one.
  adminPassword: ""

controllers:
  main:
    containers:
      readur:
        image:
          repository: readur/readur
          tag: latest
          pullPolicy: IfNotPresent
        env:
          # Server Configuration
          SERVER_HOST: "0.0.0.0"
          SERVER_PORT: "8000"

          # File Management
          UPLOAD_PATH: "/app/uploads"
          WATCH_FOLDER: "/app/watch"
          ALLOWED_FILE_TYPES: "pdf,txt,doc,docx,png,jpg,jpeg"
          MAX_FILE_SIZE_MB: "50"
          MAX_FILE_AGE_HOURS: "24"

          # OCR Settings
          OCR_LANGUAGE: "eng"
          CONCURRENT_OCR_JOBS: "4"
          OCR_TIMEOUT_SECONDS: "300"

          # Performance
          MEMORY_LIMIT_MB: "512"
          CPU_PRIORITY: "normal"

          # File Watching
          WATCH_INTERVAL_SECONDS: "30"
          FILE_STABILITY_CHECK_MS: "1000"

          # Access control (see docs/configuration-reference.md)
          # PUBLIC_URL: "https://readur.example.com"
          # ALLOW_REGISTRATION: "false"          # new accounts still need admin approval
          # JWT_TTL_HOURS: "12"
          # LOCAL_SOURCE_ALLOWED_PATHS: "/app/watch"  # unset: local folder sources are admin-only
          # TRUSTED_PROXIES: "10.0.0.0/8"         # ingress controller addresses
          # CORS_ALLOWED_ORIGINS: ""
          # METRICS_TOKEN: ""                     # bearer token for Prometheus scrapes of /metrics
          # ADMIN_EMAIL: "admin@example.com"

persistence:
  uploads:
    enabled: true
    type: persistentVolumeClaim
    storageClass:
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /app/uploads

  watch:
    enabled: true
    type: persistentVolumeClaim
    storageClass:
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /app/watch

service:
  main:
    controller: main
    enabled: true
    ports:
      http:
        port: 8000
        targetPort: 8000

ingress:
  main:
    enabled: false
    className: nginx
    annotations:
      # proxy-body-size is set to 100m to match Nginx config
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    hosts:
      - host: readur.local
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls: []
