## This chart relies on the common library chart from bjw-s
## You can find it and the values you can provide and modify, at https://github.com/bjw-s/helm-charts/blob/common-3.3.2/charts/library/common/values.yaml
## Refer there for more detail about the supported values.
## Any values that you find in the above `values.yaml` can be provided to this chart and are then rendered.

## Credentials. By default the chart creates a Secret named `<release>-auth`
## with a random initial ADMIN_PASSWORD, generated once and preserved across
## upgrades. Read it with:
##   kubectl get secret <release>-auth -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d
##
## JWT_SECRET is optional. Without it Readur generates a signing key on first
## start and keeps it in its database; `readur rotate-jwt-secret` replaces it.
## Set `auth.jwtSecret` (or JWT_SECRET in `auth.existingSecret`) to manage the
## key yourself.
##
## GitOps / `helm template`: preserving the generated admin password relies on
## Helm's `lookup` function, which only works when Helm talks to the cluster
## (`helm install` / `helm upgrade`). Renderers that do not, such as
## `helm template` and Argo CD, cannot see the existing Secret and generate a
## new value on every render. With those tools, set `auth.existingSecret` to a
## Secret you manage (e.g. Sealed Secrets or External Secrets), or set
## `auth.adminPassword`.
auth:
  # Use an existing Secret instead. It may contain ADMIN_PASSWORD and
  # JWT_SECRET (at least 32 bytes).
  existingSecret: ""
  # Optional JWT signing secret (at least 32 bytes); leave empty to let
  # Readur keep a generated key in its database.
  jwtSecret: ""
  # Initial admin password; leave empty to generate one.
  adminPassword: ""

controllers:
  main:
    containers:
      readur:
        image:
          # The image CI publishes (.github/workflows/docker-build.yml).
          repository: ghcr.io/readur/readur
          # Empty means the chart's appVersion, the Readur release this chart
          # was tested with. Set a release tag (e.g. "3.1.3") to pin another.
          tag: ""
          pullPolicy: IfNotPresent
        # Readur needs PostgreSQL, which this chart does not deploy. Set
        # DATABASE_URL (or the POSTGRES_* variables) here, for example from a
        # Secret:
        #   DATABASE_URL:
        #     valueFrom:
        #       secretKeyRef:
        #         name: readur-db
        #         key: DATABASE_URL
        env:
          # Server Configuration
          SERVER_HOST: "0.0.0.0"
          SERVER_PORT: "8000"

          # File Management
          UPLOAD_PATH: "/app/uploads"
          WATCH_FOLDER: "/app/watch"
          ALLOWED_FILE_TYPES: "pdf,txt,doc,docx,png,jpg,jpeg"
          # Hard cap on upload size; users can only set a lower per-user limit.
          MAX_FILE_SIZE_MB: "50"
          # Skip watch-folder files older than this many hours (as
          # docker-compose.yml does); remove it to import files of any age.
          MAX_FILE_AGE_HOURS: "24"

          # OCR Settings
          OCR_LANGUAGE: "eng"
          CONCURRENT_OCR_JOBS: "4"
          # Default for users without their own OCR timeout. Capped at 600:
          # queue maintenance resets jobs processing longer than 10 minutes.
          OCR_TIMEOUT_SECONDS: "300"
          # Scratch space for OCR files, PDF renders and thumbnails.
          # TEMP_DIR: "/tmp"

          # File Watching
          WATCH_INTERVAL_SECONDS: "30"
          FILE_STABILITY_CHECK_MS: "1000"

          # Access control (see docs/configuration-reference.md)
          # PUBLIC_URL: "https://readur.example.com"
          # ALLOW_REGISTRATION: "false"          # new accounts still need admin approval
          # JWT_TTL_HOURS: "12"
          # LOCAL_SOURCE_ALLOWED_PATHS: "/app/watch"  # unset: local folder sources are admin-only
          # TRUSTED_PROXIES: "10.0.0.0/8"         # ingress controller addresses
          # CORS_ALLOWED_ORIGINS: ""
          # METRICS_TOKEN: ""                     # bearer token for Prometheus scrapes of /metrics
          # ADMIN_EMAIL: "admin@example.com"

          # AI assistants (MCP endpoint at /api/mcp; see docs/mcp-guide.md)
          # MCP_ENABLED: "true"
          # MCP_ALLOW_DELETE: "false"             # expose the delete_document tool

          # S3 storage for documents instead of the uploads volume (see
          # docs/s3-storage-guide.md). Keep the secrets in a Secret (valueFrom).
          # S3_ENABLED: "true"
          # S3_BUCKET_NAME: "readur"
          # S3_REGION: "us-east-1"
          # S3_ENDPOINT_URL: ""                   # for MinIO and other S3-compatible stores
          # S3_PREFIX: ""

## Storage. By default the chart creates a PersistentVolumeClaim for each
## volume; set `existingClaim` to mount a claim you created instead. Claims the
## chart creates are kept after `helm uninstall` (`retain: true`).
persistence:
  # Documents, thumbnails and processed images. Required unless S3 storage is
  # enabled (S3_ENABLED: "true"); to accept losing documents whenever the pod
  # restarts, set `type: emptyDir` instead of disabling it.
  uploads:
    enabled: true
    type: persistentVolumeClaim
    # Name of an existing PVC to mount; empty creates one with the settings below.
    existingClaim: ""
    storageClass:
    accessMode: ReadWriteOnce
    size: 10Gi
    retain: true
    # Keeps the created claim's name "<fullname>-uploads" (e.g. readur-uploads)
    # whatever other volumes are enabled; the library drops the suffix when it
    # creates only one claim, so toggling the watch folder would otherwise
    # swap in a new, empty volume.
    suffix: uploads
    globalMounts:
      - path: /app/uploads

  # Watch folder: files placed here are imported. Optional.
  watch:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: ""
    storageClass:
    accessMode: ReadWriteOnce
    size: 5Gi
    retain: true
    globalMounts:
      - path: /app/watch

service:
  main:
    controller: main
    enabled: true
    ports:
      http:
        port: 8000
        targetPort: 8000

ingress:
  main:
    enabled: false
    className: nginx
    annotations:
      # proxy-body-size is set to 100m to match Nginx config
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    hosts:
      - host: readur.local
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls: []
