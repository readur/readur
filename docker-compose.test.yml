services:
  postgres_test:
    image: postgres:18
    container_name: readur_postgres_test
    environment:
      POSTGRES_USER: readur_test
      POSTGRES_PASSWORD: readur_test
      POSTGRES_DB: readur_test
      # Explicit PGDATA ensures compatibility across PostgreSQL 17 and 18+
      PGDATA: /var/lib/postgresql/data
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
    ports:
      - "5433:5432" # Different port to avoid conflict
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readur_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - readur_test_network

  readur_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: readur_app_test
    environment:
      # Database configuration
      DATABASE_URL: postgresql://readur_test:readur_test@postgres_test/readur_test

      # Server configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8001 # Different port from dev

      # Security
      # Published test-only secret; accepted only with READUR_INSECURE_DEV_MODE
      JWT_SECRET: readur-test-environment-only-jwt-secret-0123456789
      READUR_INSECURE_DEV_MODE: "true"
      # Seeded admin; test tooling provisions users through it. run-tests.sh exports
      # ADMIN_PASSWORD with this same default (tests/integration_tooling_env_tests.rs keeps the
      # two in step), so the server and the suites always agree on it.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-readur-test-admin-password}

      # File paths (using temporary directories)
      UPLOAD_PATH: /tmp/test_uploads
      WATCH_FOLDER: /tmp/test_watch

      # OCR configuration
      OCR_LANGUAGE: eng
      CONCURRENT_OCR_JOBS: 2 # Lower for tests
      OCR_TIMEOUT_SECONDS: 60 # Shorter timeout for tests
      MAX_FILE_SIZE_MB: 10 # Smaller for tests

      # Performance (reduced for testing)

      # File watching
      ALLOWED_FILE_TYPES: pdf,txt,doc,docx,png,jpg,jpeg
      WATCH_INTERVAL_SECONDS: 5 # Faster for tests
      FILE_STABILITY_CHECK_MS: 500
      MAX_FILE_AGE_HOURS: 1

      # Logging
      RUST_LOG: debug
      RUST_BACKTRACE: 1

    ports:
      - "8001:8001" # Different port from dev

    volumes:
      # Using tmpfs for faster test execution
      - type: tmpfs
        target: /tmp/test_uploads
      - type: tmpfs
        target: /tmp/test_watch
      # No migrations mount: sqlx::migrate! compiles them into the binary.

    depends_on:
      postgres_test:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - readur_test_network

  # Frontend test runner service
  frontend_test:
    image: node:26-alpine
    container_name: readur_frontend_test
    working_dir: /work/frontend
    environment:
      NODE_ENV: test
      CI: true
    # The sources are copied out of a read-only mount of the checkout (frontend/ without the
    # host's node_modules and dist, plus the scripts/ and docs/ files some frontend tests read)
    # and installed inside the container, so the run never writes into the checkout and works
    # whether or not the host has installed node_modules. test:unit is the unit suite CI runs;
    # plain `vitest` would also pick up the Playwright specs.
    volumes:
      - .:/src:ro
    command:
      [
        "sh",
        "-c",
        "tar -C /src --exclude=frontend/node_modules --exclude=frontend/dist -cf - frontend scripts docs | tar -xf - -C /work && npm ci && npm run test:unit -- --reporter=verbose",
      ]
    networks:
      - readur_test_network
    profiles:
      - frontend-tests

  # Frontend development server for E2E tests
  frontend_dev:
    image: node:26-alpine
    container_name: readur_frontend_dev
    working_dir: /work/frontend
    environment:
      NODE_ENV: development
      # vite.config.ts proxies /api (HTTP and WebSocket) here; the host and port come from
      # the command line below.
      VITE_API_PROXY_TARGET: http://readur_test:8001
    # Copied out of a read-only mount, as for frontend_test above.
    volumes:
      - ./frontend:/src/frontend:ro
    command:
      [
        "sh",
        "-c",
        "tar -C /src --exclude=frontend/node_modules --exclude=frontend/dist -cf - frontend | tar -xf - -C /work && npm ci && npm run dev -- --host 0.0.0.0 --port 5174 --strictPort",
      ]
    ports:
      - "5174:5174"
    networks:
      - readur_test_network
    depends_on:
      readur_test:
        condition: service_healthy
    profiles:
      - e2e-tests

  # Dufs WebDAV server for stress testing
  dufs_webdav:
    image: sigoden/dufs:v0.47.0 # renovate: datasource=docker depName=sigoden/dufs
    container_name: readur_dufs_webdav
    command: >
      /data
      -p 8080
      -A
      -a webdav_user:webdav_pass@/:rw
    volumes:
      # Using tmpfs for ephemeral WebDAV test data
      - type: tmpfs
        target: /data
        tmpfs:
          size: 1G
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--auth-no-challenge",
          "--http-user=webdav_user",
          "--http-password=webdav_pass",
          "http://localhost:8080/",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - readur_test_network
    profiles:
      - webdav-stress

  # WebDAV stress test orchestrator
  webdav_stress_orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.stress
    container_name: readur_stress_orchestrator
    environment:
      - RUST_LOG=debug,webdav_stress=trace
      - WEBDAV_DUFS_URL=http://dufs_webdav:8080
      - WEBDAV_USERNAME=webdav_user
      - WEBDAV_PASSWORD=webdav_pass
      - STRESS_TEST_DURATION=300
      - LOOP_DETECTION_TIMEOUT=60
    volumes:
      - ./tests/stress:/app/tests/stress:ro
      - type: tmpfs
        target: /tmp/stress-results
    depends_on:
      dufs_webdav:
        condition: service_healthy
    networks:
      - readur_test_network
    profiles:
      - webdav-stress

networks:
  readur_test_network:
    name: readur_test_network
    driver: bridge

# No persistent volumes - everything is ephemeral for tests
