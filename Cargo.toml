[package]
name = "readur"
version = "3.1.0"
edition = "2021"

[[bin]]
name = "readur"
path = "src/main.rs"

[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"

[[bin]]
name = "analyze-webdav-performance"
path = "src/bin/analyze-webdav-performance.rs"




[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid", "migrate"] }
regex = "1.11"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.19"
base64ct = { version = "=1.8.3", features = ["alloc"] }
# 11.x needs exactly one crypto backend; aws-lc is already built for the AWS SDK.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
futures = "0.3"
notify = "8"
mime_guess = "2"
infer = "0.22"
tesseract = { version = "0.15", optional = true }
image = { version = "0.25", features = ["png", "jpeg", "tiff", "bmp"], optional = true }
imageproc = { version = "0.27", optional = true }
kamadak-exif = { version = "0.6.1", optional = true }
thiserror = "2.0"
sysinfo = "0.40"
raw-cpuid = { version = "11", optional = true }
# 0.13 made rustls the default TLS backend; keep native-tls (system OpenSSL) so
# WebDAV/S3 servers that only speak legacy TLS keep working. `form` (OIDC) is opt-in
# since 0.13, as is `query`.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "multipart", "form", "query"] }
quick-xml = { version = "0.37", features = ["serialize"] }
urlencoding = "2.1"
url = "2.4"
ipnet = "2"
dotenvy = "0.15"
hostname = "0.4"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
once_cell = "1.21"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
# Generates the frontend API types (frontend/src/types/generated) from the Rust models.
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
aws-config = { version = "1.8", optional = true }
aws-sdk-s3 = { version = "1.92", optional = true }
aws-credential-types = { version = "1.2", optional = true }
aws-types = { version = "1.3", optional = true }
# HTTP client for the S3 SDK with a custom DNS resolver (outbound destination checks)
aws-smithy-http-client = { version = "1.4", features = ["rustls-aws-lc"], optional = true }
aws-smithy-runtime-api = { version = "1.18", features = ["client"], optional = true }
sha2 = "0.11"
utoipa-swagger-ui = { version = "10", features = ["axum"] }
testcontainers = { version = "0.27", optional = true }
testcontainers-modules = { version = "0.15", features = ["postgres"], optional = true }
libc = { version = "0.2", optional = true }
# Office document support - now using XML extraction only
zip = "9"             # Still needed for other archive handling
rand = "0.10"

[features]
default = ["ocr", "s3"]
ocr = ["tesseract", "image", "imageproc", "raw-cpuid", "kamadak-exif"]
s3 = ["aws-config", "aws-sdk-s3", "aws-credential-types", "aws-types", "aws-smithy-http-client", "aws-smithy-runtime-api"]
test-utils = ["testcontainers", "testcontainers-modules", "libc"]
stress-testing = ["test-utils"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"
futures = "0.3"
rand = "0.10"
# Database testing dependencies
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# Dependencies for creating proper test Office documents
rust_xlsxwriter = "0.102"  # For creating proper XLSX test files
# WebDAV server for realistic stress testing
dav-server = { version = "0.11", features = ["memfs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# Enable test-utils feature for all tests
readur = { path = ".", features = ["test-utils"] }

[profile.test]
incremental = false
debug = false

# Test configuration to prevent resource contention
[[test]]
name = "integration_smart_sync_deep_scan"
path = "tests/integration_smart_sync_deep_scan.rs"
harness = true

# WebDAV Stress Testing configuration
[[test]]
name = "webdav_stress_tests"
path = "tests/webdav_stress_tests.rs"
required-features = ["stress-testing"]
harness = true
