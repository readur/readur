name: E2E Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  CARGO_TERM_COLOR: always
  # CI_JWT_SECRET is generated per run (see "Generate throwaway JWT secret").
  # Seeded admin account; the E2E suite logs in with it to provision test users.
  E2E_ADMIN_USERNAME: admin
  E2E_ADMIN_PASSWORD: e2e-ci-admin-password

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: readur
          POSTGRES_PASSWORD: readur
          POSTGRES_DB: readur
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate throwaway JWT secret
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "CI_JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-spa \
            tesseract-ocr-fra \
            tesseract-ocr-deu \
            tesseract-ocr-ita \
            tesseract-ocr-por \
            libtesseract-dev \
            libleptonica-dev \
            pkg-config \
            libclang-dev \
            ocrmypdf \
            poppler-utils \
            clang

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Build backend
        run: cargo build --release
        env:
          DATABASE_URL: postgres://readur:readur@localhost:5432/readur
          RUST_BACKTRACE: 1

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Start backend server
        run: |
          echo "Starting server with DATABASE_URL: $DATABASE_URL"
          ./target/release/readur > server.log 2>&1 &
          echo $! > backend.pid
          sleep 2
          echo "Server started with PID: $(cat backend.pid)"
        env:
          DATABASE_URL: postgres://readur:readur@localhost:5432/readur
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          ADMIN_USERNAME: ${{ env.E2E_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          PORT: 8000
          FRONTEND_PATH: ./frontend/dist
          UPLOAD_PATH: ./uploads
          WATCH_PATH: ./watch
          RUST_BACKTRACE: 1
          DEBUG: 1

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      # Only the Chromium projects have been verified against the current UI, so CI runs those.
      # TODO: re-enable Firefox and WebKit (the `firefox` and `webkit` projects in
      # playwright.config.ts, kept there for local runs) once they pass, and install all browsers.
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests
        working-directory: ./frontend
        run: npm run test:e2e -- --project=chromium --project=chromium-websocket
        env:
          VITE_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:8000

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 30

      - name: Print server logs on failure
        if: failure()
        run: |
          echo "=== Server logs ==="
          cat server.log || echo "No server logs found"
          echo "=== End of server logs ==="

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi
