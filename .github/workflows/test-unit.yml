name: Unit Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-spa \
            tesseract-ocr-fra \
            tesseract-ocr-deu \
            tesseract-ocr-ita \
            tesseract-ocr-por \
            libtesseract-dev \
            libleptonica-dev \
            pkg-config \
            libclang-dev \
            clang \
            poppler-utils \
            ghostscript \
            unpaper \
            pngquant \
            python3 \
            python3-pip \
            antiword \
            catdoc
          # Install pinned ocrmypdf from PyPI instead of stale apt version.
          # Pinned so upstream releases can't break unrelated PRs (e.g. 17.8.0
          # moved --help/--version to stderr); Renovate bumps this pin.
          pip3 install --no-cache-dir 'ocrmypdf==17.12.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Run Rust unit tests - lib only
        run: |
          cargo test --lib --no-fail-fast
        env:
          RUST_BACKTRACE: 1

      - name: Run Rust unit tests - unit_tests only
        run: |
          cargo test --tests unit_tests --no-fail-fast
        env:
          RUST_BACKTRACE: 1

      - name: Check generated TypeScript bindings are up to date
        if: always()
        run: scripts/check-ts-bindings.sh

  frontend-unit-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run type checking
        run: npm run type-check

      - name: Run type checking (test files)
        run: npm run type-check:test

      - name: Run frontend unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  repo-ratchets:
    name: File length and locale parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: File-length ratchet
        run: python3 scripts/lint-file-length.py

      - name: Locale parity
        run: node scripts/check-locale-parity.mjs
