name: Unit Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-spa \
            tesseract-ocr-fra \
            tesseract-ocr-deu \
            tesseract-ocr-ita \
            tesseract-ocr-por \
            libtesseract-dev \
            libleptonica-dev \
            pkg-config \
            libclang-dev \
            clang \
            poppler-utils \
            ghostscript \
            unpaper \
            pngquant \
            python3 \
            python3-pip \
            antiword \
            catdoc
          # Install pinned ocrmypdf from PyPI instead of stale apt version.
          # Pinned so upstream releases can't break unrelated PRs (e.g. 17.8.0
          # moved --help/--version to stderr); Renovate bumps this pin.
          pip3 install --no-cache-dir 'ocrmypdf==17.10.0'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Run Rust unit tests - lib only
        run: |
          cargo test --lib --no-fail-fast
        env:
          RUST_BACKTRACE: 1

      - name: Run Rust unit tests - unit_tests only
        run: |
          cargo test --tests unit_tests --no-fail-fast
        env:
          RUST_BACKTRACE: 1

  frontend-unit-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run type checking
        run: npm run type-check

      - name: Run frontend unit tests
        run: npm run test:unit
