name: Integration Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://readur:readur@localhost:5432/readur
  # CI_JWT_SECRET is generated per job (see "Generate throwaway JWT secret").
  # The server and test steps read the same value so tokens minted in tests
  # verify on the server.
  CI_ADMIN_PASSWORD: integration-ci-admin-password
  # Partitions the in-process suites are split into (the `in-process` matrix).
  NEXTEST_PARTITIONS: 4

permissions:
  contents: read

# A newer push to the same PR or branch supersedes this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job graph:
#   build-tests ──┬─> in-process (matrix: one hash partition each) ─┐
#                 └─> live-server <── build-server                  ├─> Integration Tests
#                                                                   │
# The suites listed in .config/live-server-suites need a running readur server
# (or the WebDAV server) and run in `live-server`; every other suite runs in the
# `in-process` shards. scripts/ci/live-server-filterset.sh turns that one list
# into the nextest filterset both sides use, so every suite runs exactly once.
# "Integration Tests" is the single required check: it fails unless every job
# above succeeded.

jobs:
  build-tests:
    name: Build test archive
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          echo "Initial disk usage:"
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo apt-get clean
          echo "Disk usage after cleanup:"
          df -h

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtesseract-dev \
            libleptonica-dev \
            pkg-config \
            libclang-dev \
            clang

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.149

      # Every integration test binary (tests/*.rs), with the stress tests, built once
      # and run from the archive by the jobs below.
      - name: Build and archive the integration test binaries
        run: |
          cargo nextest archive --test '*' --features "test-utils stress-testing" \
            --archive-file nextest.tar.zst
          ls -lh nextest.tar.zst

      - name: Upload test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: nextest.tar.zst
          # Already zstd-compressed.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-server:
    name: Build server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtesseract-dev \
            libleptonica-dev \
            pkg-config \
            libclang-dev \
            clang

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Build readur binary
        run: cargo build --release

      - name: Upload readur binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readur-release
          path: target/release/readur
          retention-days: 1
          if-no-files-found: error

  in-process:
    name: In-process suites (${{ matrix.partition }}/4)
    needs: build-tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keep in step with NEXTEST_PARTITIONS.
        partition: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: readur
          POSTGRES_PASSWORD: readur
          POSTGRES_DB: readur
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo apt-get clean
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          df -h

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The archive's tests read fixtures and repository files, found through
      # --workspace-remap below.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-pull Docker images for testcontainers
        run: |
          # readur::test_db uses the postgres service below (READUR_TEST_POSTGRES_URL);
          # the image is cached anyway in case a test starts a container of its own.
          docker pull postgres:18

      - name: Remove local .env to prevent conflicts
        run: |
          # .env.test is left in place: only run-tests.sh loads it, and the tooling
          # tests read it as a tracked file.
          [ -f .env ] && mv .env .env.backup || true

      - name: Generate throwaway JWT secret
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "CI_JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-spa \
            tesseract-ocr-fra \
            tesseract-ocr-deu \
            tesseract-ocr-ita \
            tesseract-ocr-por \
            libtesseract-dev \
            libleptonica-dev \
            poppler-utils \
            ghostscript \
            unpaper \
            pngquant \
            python3 \
            python3-pip \
            antiword \
            catdoc
          # Install pinned ocrmypdf from PyPI instead of stale apt version.
          # Pinned so upstream releases can't break unrelated PRs (e.g. 17.8.0
          # moved --help/--version to stderr); Renovate bumps this pin.
          pip3 install --no-cache-dir 'ocrmypdf==17.14.2'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.149

      - name: Download test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive

      - name: Run in-process integration tests
        run: |
          filterset="$(scripts/ci/live-server-filterset.sh)"
          cargo-nextest nextest run --archive-file nextest.tar.zst --workspace-remap . \
            --profile ci --partition "hash:${PARTITION}/${NEXTEST_PARTITIONS}" \
            -E "not ($filterset)"
        env:
          PARTITION: ${{ matrix.partition }}
          # One server for every test process; each test gets its own database
          # cloned from a migrated template (readur::test_db).
          READUR_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          SERVER_ADDRESS: 0.0.0.0:8000
          UPLOAD_PATH: ./uploads
          WATCH_FOLDER: ./watch
          RUST_LOG: debug
          RUST_BACKTRACE: 1
          DEBUG: 1
          TESTCONTAINERS_RYUK_DISABLED: true
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Print disk usage on failure
        if: failure()
        run: |
          df -h
          du -sh "$RUNNER_TEMP" || true

  live-server:
    name: Live-server suites
    needs: [build-tests, build-server]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: readur
          POSTGRES_PASSWORD: readur
          POSTGRES_DB: readur
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo apt-get clean
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          df -h

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-pull Docker images for testcontainers
        run: docker pull postgres:18

      - name: Remove local .env to prevent conflicts
        run: |
          # The server loads .env (dotenvy) and would let it override CI variables.
          # .env.test is left in place: only run-tests.sh loads it, and the tooling
          # tests read it as a tracked file.
          [ -f .env ] && mv .env .env.backup || true

      - name: Generate throwaway JWT secret
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "CI_JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-spa \
            tesseract-ocr-fra \
            tesseract-ocr-deu \
            tesseract-ocr-ita \
            tesseract-ocr-por \
            libtesseract-dev \
            libleptonica-dev \
            poppler-utils \
            ghostscript \
            unpaper \
            pngquant \
            python3 \
            python3-pip \
            antiword \
            catdoc
          # Pinned so upstream releases can't break unrelated PRs; Renovate bumps this pin.
          pip3 install --no-cache-dir 'ocrmypdf==17.14.2'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.149

      - name: Download test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive

      - name: Download readur binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readur-release
          path: target/release

      - name: Start readur server
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x target/release/readur
          ./target/release/readur > server.log 2>&1 &
          echo $! > readur.pid
          echo "Server started with PID: $(cat readur.pid)"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          SERVER_ADDRESS: 0.0.0.0:8000
          UPLOAD_PATH: ./uploads
          WATCH_FOLDER: ./watch
          DEBUG: 1

      - name: Wait for server to be ready
        run: |
          # Fail the job when the server never answers, instead of running the suites
          # against nothing (many of them skip when the server is down); the server
          # log says why it did not come up.
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Readur server is ready"
              exit 0
            fi
            if ! kill -0 "$(cat readur.pid)" 2>/dev/null; then
              echo "::error::Server process exited before becoming ready"
              break
            fi
            echo "Waiting for readur server... ($i/30)"
            sleep 2
          done
          echo "::error::Server did not become ready at http://localhost:8000/api/health"
          echo "--- last 100 lines of server.log ---"
          tail -n 100 server.log || true
          exit 1

      - name: Verify database connection
        run: |
          PGPASSWORD=readur psql -h localhost -p 5432 -U readur -d readur -c "SELECT version();"

      - name: Setup WebDAV server for stress tests
        run: |
          webdav_root="$RUNNER_TEMP/webdav-server"
          mkdir -p "$webdav_root"
          chmod +x scripts/generate-webdav-test-data.sh
          ./scripts/generate-webdav-test-data.sh \
            --webdav-root "$webdav_root" \
            --stress-level light \
            --include-large-directories \
            --include-unicode-names

          docker run -d \
            --name dufs-webdav \
            --network host \
            -v "$webdav_root:/data:rw" \
            sigoden/dufs:latest \
            /data \
            -p 8080 \
            -A \
            -a testuser:testpass123@/:rw

          echo "Waiting for Dufs WebDAV container to start..."
          response=000
          for i in {1..30}; do
            if docker ps | grep -q dufs-webdav; then
              response=$(curl -s -o /dev/null -w "%{http_code}" -u testuser:testpass123 http://127.0.0.1:8080/ 2>/dev/null || echo "000")
              if [ "$response" = "200" ]; then
                echo "Dufs WebDAV server is ready (HTTP $response)"
                break
              fi
            fi
            echo "Waiting for Dufs... (attempt $i/30, HTTP response: $response)"
            sleep 1
          done

          if ! docker ps | grep -q dufs-webdav; then
            echo "::error::Dufs container is not running"
            docker logs dufs-webdav 2>&1 || true
            exit 1
          fi
          if ! curl -s -u testuser:testpass123 http://127.0.0.1:8080/ > /dev/null; then
            echo "::error::Cannot connect to Dufs WebDAV server"
            docker logs dufs-webdav 2>&1 || true
            exit 1
          fi
          docker logs dufs-webdav 2>&1 | tail -5

      - name: Run live-server integration tests
        run: |
          filterset="$(scripts/ci/live-server-filterset.sh)"
          cargo-nextest nextest run --archive-file nextest.tar.zst --workspace-remap . \
            --profile ci -E "$filterset"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          # Suites that also build an in-process app get their own databases on the
          # same PostgreSQL server (readur::test_db), next to the server's.
          READUR_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
          API_URL: http://localhost:8000
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          SERVER_ADDRESS: 0.0.0.0:8000
          UPLOAD_PATH: ./uploads
          WATCH_FOLDER: ./watch
          RUST_LOG: debug
          RUST_BACKTRACE: 1
          DEBUG: 1
          TESTCONTAINERS_RYUK_DISABLED: true
          DOCKER_HOST: unix:///var/run/docker.sock
          WEBDAV_SERVER_URL: http://127.0.0.1:8080
          WEBDAV_USERNAME: testuser
          WEBDAV_PASSWORD: testpass123

      - name: Print server logs on failure
        if: failure()
        run: |
          echo "=== Disk usage on failure ==="
          df -h
          echo "=== Readur Server logs ==="
          cat server.log || echo "No server logs found"
          echo "=== Dufs WebDAV Docker logs ==="
          docker logs dufs-webdav 2>&1 || echo "No Dufs container logs found"

      - name: Stop servers
        if: always()
        run: |
          if [ -f readur.pid ]; then
            kill "$(cat readur.pid)" || true
            rm readur.pid
          fi
          docker stop dufs-webdav 2>/dev/null || true
          docker rm dufs-webdav 2>/dev/null || true

  # The required check. Keeps the name the single integration job had, so branch
  # protection needs no change; it fails if any job above failed, was cancelled
  # or was skipped.
  integration-tests:
    name: Integration Tests
    if: always()
    needs: [build-tests, build-server, in-process, live-server]
    runs-on: ubuntu-latest

    steps:
      - name: Require every integration job to succeed
        # needs.*.result is success, failure, cancelled or skipped (a job whose own needs
        # failed is skipped).
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A required job did not succeed; see the jobs above."
          exit 1

  frontend-integration-tests:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run frontend integration tests
        run: npm run test:integration
